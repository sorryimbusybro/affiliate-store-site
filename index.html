    <!--
      BOOT SHELL. Paints the page's own grey skeleton before the JS bundle has
      parsed, so the first frame of the shop is never a white flash. It mirrors
      what the homepage actually paints first: the header, then the "What's New"
      rail — a title bar and a row of moving CARD plates, not one big grey block
      standing in for the whole content area. Same #F1F1F1 plates and the same
      card geometry as the React skeleton that replaces it.
      createRoot() clears #root on mount, so none of this survives hydration.
      Keep it inline and tiny: it must be parsed before the first paint.
    -->
    <style>
      html, body { margin: 0; background: #fff; }
      .boot { --boot-pad: 12px; padding: 0 var(--boot-pad) 48px; }
      @media (min-width: 768px) { .boot { --boot-pad: 24px; } }
      @media (min-width: 1024px) { .boot { --boot-pad: 40px; } }
      .boot-head { height: 105px; display: flex; flex-wrap: wrap; align-content: center; align-items: center; gap: 12px; }
      .boot-head span { display: block; }
      .boot-logo { height: 24px; width: 128px; border-radius: 6px; background: #F1F1F1; }
      .boot-actions { margin-left: auto; height: 20px; width: 96px; border-radius: 6px; background: #F4F4F4; }
      .boot-search { flex: 0 0 100%; height: 40px; border-radius: 999px; background: #F4F4F4; }
      .boot-body { padding: 4px 0 0; }
      .boot-title { margin: 0 auto 16px; width: 168px; height: 26px; border-radius: 6px; background: #F1F1F1; }
      .boot-rail { display: flex; gap: 20px; overflow: hidden; }
      .boot-rail i { display: block; flex: 0 0 208px; aspect-ratio: 3 / 4.6; border-radius: 22px; background: #F1F1F1; }
      @media (min-width: 600px) { .boot-rail i { flex-basis: 236px; } }
      @media (min-width: 900px) { .boot-rail i { flex-basis: 256px; } }
    </style>
